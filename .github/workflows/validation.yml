name: Validation
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: |
          uv sync --group dev
      - name: Format check
        run: |
          uv run ruff format --check .
      - name: Lint
        run: |
          uv run ruff check
      - name: Type check
        run: |
          uv run ty check krcg_cli
      - name: Test
        run: |
          uv run pytest
